:root{--cocoa:#2b130c;--cocoa2:#4a2418;--maroon:#6b2e24;--bronze:#8f6b52;--terra:#b87a59;--terra-l:#d9a487;--cream:#faf6f1;--blush:#f0e2da;--sand:#efe5db;--ink:#4a1f15;--text:#5c3a30;--soft:#8a6f63;--line:#eadfd5;--ok:#3f7d5c;--warn:#b7791f;--bad:#a8453a;--sh:0 18px 40px -22px rgba(74,31,21,.45)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Jost",system-ui,sans-serif;color:var(--text);background:var(--cream);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:400;color:var(--ink);margin:0;line-height:1.15}
h2{font-size:clamp(30px,4.2vw,46px);font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:8px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
svg{display:block}
/* animações */
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,122,89,.55)}100%{box-shadow:0 0 0 16px rgba(184,122,89,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.up{animation:up .7s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 26px;border-radius:12px;border:1px solid transparent;background:var(--bronze);color:#fff;font-weight:500;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:var(--terra);transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(107,46,36,.6)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.dark{background:var(--maroon)}.btn.dark:hover{background:#823a2e}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.45)}.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.line{background:#fff;color:var(--ink);border-color:var(--line)}.btn.line:hover{background:var(--blush)}
.btn.danger{background:#fff;color:var(--bad);border-color:#e8c2bc}.btn.danger:hover{background:#fbeeec}
.btn.s{min-height:38px;padding:6px 14px;border-radius:10px;font-size:15px}
/* topo */
.nav{position:fixed;top:14px;left:0;right:0;z-index:40;padding:0 14px}
.pill{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 24px;border-radius:26px;background:rgba(43,19,12,.62);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);color:#f6e8de;transition:background .3s}
.pill.solid{background:rgba(43,19,12,.94)}
.pill a{color:#f6e8de;text-decoration:none;padding:8px 12px;border-radius:10px;font-size:16px;opacity:.9}
.pill a:hover{opacity:1;background:rgba(255,255,255,.08)}
.pill .grow{flex:1}
.pill .links{display:none;gap:2px}
@media(min-width:960px){.pill .links{display:flex}}
.panelbtn{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:9px 16px;font-weight:500;min-height:44px}
.panelbtn:hover{background:rgba(255,255,255,.2)}
.panelbtn.hint{animation:pulse 1.8s infinite}
.logo{font-family:"Allura",cursive;font-size:30px;line-height:1;color:#fff;margin-right:10px;white-space:nowrap}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;color:#fff;overflow:hidden;background:radial-gradient(1200px 700px at 78% 40%,#7a4a3a 0,#4a2418 45%,#2b130c 100%)}
.hero .wrap{position:relative;z-index:2;display:grid;gap:30px;grid-template-columns:1fr;align-items:center;padding-top:130px;padding-bottom:60px}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(40px,6vw,68px);color:#fff;margin:26px 0 18px}
.hero p{max-width:560px;font-size:19px;color:#f1ddd0}
.hero .sig{font-family:"Allura",cursive;font-size:56px;line-height:1;color:#fff}
.hero .sub{letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:#ecd6c8}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35;animation:float 9s ease-in-out infinite}
/* seções */
section{position:relative}
.sec{padding:96px 0}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--terra);font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:14px;margin-bottom:14px}
.eyebrow:before{content:"";width:34px;height:2px;background:var(--terra)}
.two{display:grid;gap:56px;grid-template-columns:1fr;align-items:center}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}.two.rev .art{order:2}}
.art{position:relative}
.frame{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--sh);background:linear-gradient(160deg,#e8cdbd,#c99580 60%,#8f6b52)}
.circle{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--blush);top:-22px;right:-22px;z-index:-1}
.quote{position:absolute;left:-14px;bottom:-34px;max-width:300px;background:#fff;border-left:4px solid var(--terra);border-radius:8px 16px 16px 8px;padding:16px 20px;font-family:"Fraunces",serif;font-style:italic;font-size:15.5px;color:var(--ink);box-shadow:var(--sh)}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.bdg{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-weight:500;color:var(--ink);box-shadow:0 6px 16px -12px rgba(74,31,21,.5)}
.bdg svg{color:var(--terra)}
.cards{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s}
.card.hv:hover{transform:translateY(-8px);box-shadow:0 28px 46px -24px rgba(74,31,21,.55)}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--blush);color:var(--maroon);margin-bottom:16px;transition:transform .4s}
.card:hover .ico{transform:rotate(-8deg) scale(1.08)}
.bgs{background:var(--sand)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 20px;color:var(--ink);font-weight:500;transition:.25s}
.chip:hover{background:var(--maroon);color:#fff;transform:translateY(-3px)}
.price{font-family:"Fraunces";font-size:28px;color:var(--maroon);font-weight:600}
.steps3{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));position:relative}
.step{text-align:center;padding:0 10px}
.step .n{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;font-family:"Fraunces";font-size:30px;position:relative}
.step .n:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--terra-l);animation:spin 18s linear infinite}
details.faq{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:box-shadow .3s}
details.faq[open]{box-shadow:var(--sh)}
details.faq summary{list-style:none;cursor:pointer;padding:20px 24px;font-family:"Fraunces";font-size:20px;color:var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"+";font-size:28px;color:var(--terra);transition:transform .3s}
details.faq[open] summary:after{transform:rotate(45deg)}
details.faq p{margin:0;padding:0 24px 22px;animation:up .4s}
footer.ft{background:var(--cocoa);color:#ead7ca;padding:50px 0 30px;font-size:15px}
footer.ft a{color:#f4d9c6}
/* ===== agendamento ===== */
.book{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:960px){.book{grid-template-columns:1.35fr .65fr;align-items:start}}
.bk{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--sh)}
.stepper{display:flex;align-items:center;margin-bottom:22px}
.stepper .s{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);font-weight:500}
.stepper .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:var(--soft);font-weight:500;transition:.4s}
.stepper .s.on .dot{background:var(--maroon);color:#fff;transform:scale(1.12);animation:pulse 1.6s 1}
.stepper .s.done .dot{background:var(--ok);color:#fff}
.stepper .s.on{color:var(--ink)}
.stepper .ln{flex:1;height:3px;background:var(--sand);margin:0 8px;border-radius:3px;position:relative;overflow:hidden;min-width:14px}
.stepper .ln i{position:absolute;inset:0;background:var(--terra);transform-origin:left;transform:scaleX(0);transition:transform .6s}
.stepper .ln.on i{transform:scaleX(1)}
@media(max-width:620px){.stepper .s span{display:none}}
.svcb{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:12px;transition:.25s;position:relative;overflow:hidden}
.svcb:hover{border-color:var(--terra-l);transform:translateX(4px)}
.svcb[aria-pressed=true]{border-color:var(--maroon);background:#fbf3ee}
.svcb[aria-pressed=true]:after{content:"✓";position:absolute;right:16px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;animation:pop .35s}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calh h3{font-size:24px}
.nv{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;transition:.2s}.nv:hover{background:var(--maroon);color:#fff;transform:scale(1.08)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:13px;text-align:center;color:var(--soft);letter-spacing:.08em;padding:4px 0}

  const plan=[[0,-4,9,0,"s2","completed"],[1,-3,10,0,"s2","completed"],[2,-2,14,0,"s3","no_show"],[3,-1,15,0,"s2","completed"],[0,0,9,0,"s2","confirmed"],[4,0,14,0,"s1","confirmed"],[5,0,16,0,"s3","pending"],[6,1,9,0,"s1","confirmed"],[0,1,10,30,"s2","pending"],[5,1,14,0,"s3","pending"],[1,2,10,0,"s2","confirmed"],[2,2,15,0,"s2","cancelled"],[3,3,14,0,"s3","pending"],[4,3,9,30,"s2","confirmed"],[6,4,11,0,"s2","pending"]];

  const b=at(10,0);S.blocks.push({id:uid(),start:new Date(new Date(b).setHours(0,0,0,0)).toISOString(),end:new Date(new Date(b).setHours(24,0,0,0)).toISOString(),reason:"Feriado"});

function mk(name,phone,start,svId,source){
  const sv=svcOf(svId),end=new Date(+start+sv.min*60000),be=new Date(+end+CFG.buffer*60000);colorOf(phone);
  const a={id:uid(),code:code(),name,phone,sv:svId,start:start.toISOString(),end:end.toISOString(),blockEnd:be.toISOString(),status:source==="manual"?"confirmed":"pending",resch:0,source};

  const t=new Date(+start-864e5);if(t>new Date())enqueue(a,"reminder_24h",t);return a}
function addHist(a,action,who,x={}){S.hist.push({id:uid(),appt:a.id,action,who,at:new Date().toISOString(),...x})}

/* ===== motor de disponibilidade (mesma lógica do sistema real) ===== */
const overlaps=(aS,aE,bS,bE)=>aS<bE&&aE>bS;
function slotsFor(ds,min,excl,now=new Date()){
  const [y,m,d]=ds.split("-").map(Number),wd=new Date(y,m-1,d).getDay()||7,out=[];
  const rel=+now===0;if(rel)now=new Date();/* now=0 => modo da profissional: sem antecedência mínima */const earliest=rel?0:+now+CFG.minNoticeH*36e5,latest=+now+CFG.maxAdvanceD*864e5;
  const busy=S.appts.filter(a=>ACTIVE.includes(a.status)&&a.id!==excl).map(a=>[+new Date(a.start),+new Date(a.blockEnd)]);
  const blocks=S.blocks.map(b=>[+new Date(b.start),+new Date(b.end)]);
  for(const [rs,re] of CFG.rules[wd]||[]){
    const [sh,sm]=rs.split(":").map(Number),[eh,em]=re.split(":").map(Number),we=new Date(y,m-1,d,eh,em);
    for(let s=new Date(y,m-1,d,sh,sm);;s=new Date(+s+CFG.step*60000)){
      const e=new Date(+s+min*60000);if(e>we)break;const sM=+s,eM=+e,bE=eM+CFG.buffer*60000;
      if(sM<earliest||sM>latest)continue;
      if(busy.some(([a,b])=>overlaps(sM,bE,a,b)))continue;
      if(blocks.some(([a,b])=>overlaps(sM,eM,a,b)))continue;
      out.push(s)}}
  return out}
const tryBook=(start,sv,name,phone)=>slotsFor(iso(start),svcOf(sv).min).some(s=>+s===+start)?mk(name,phone,start,sv,"online"):null;
function tryResched(a,ns,who){
  if(!slotsFor(iso(ns),svcOf(a.sv).min,a.id,new Date(0)).some(s=>+s===+ns))return false;
  const sv=svcOf(a.sv),o=a.start;a.start=ns.toISOString();a.end=new Date(+ns+sv.min*60000).toISOString();a.blockEnd=new Date(+ns+(sv.min+CFG.buffer)*60000).toISOString();a.resch++;
  addHist(a,"rescheduled",who,{from:o,to:a.start});cancelJobs(a);enqueue(a,"rescheduled",new Date());const t=new Date(+ns-864e5);if(t>new Date())enqueue(a,"reminder_24h",t);return true}
function cancelAppt(a,who,reason){a.status="cancelled";addHist(a,"cancelled",who,{note:reason});cancelJobs(a);enqueue(a,"cancelled",new Date())}

function picker(root,{min,exclude,relaxed,start,onPick}){
  let cur=start?new Date(start.getFullYear(),start.getMonth(),1):(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),1)})(),selDate=start?iso(start):null,sel=start||null,anim=0;
  const now=()=>relaxed?new Date(0):new Date();
  function draw(){
    const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate(),off=cur.getDay(),label=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    let cells="";for(let d=1;d<=dim;d++){const ds=`${y}-${pad(m+1)}-${pad(d)}`,n=slotsFor(ds,min,exclude,now()).length;
      cells+=`<button class="day ${n?"ok":""} ${selDate===ds?"sel":""} ${ds===iso(new Date())?"today":""}" style="animation-delay:${(d+off)*12}ms" ${n?"":"disabled"} data-d="${ds}" aria-label="${d} de ${label}${n?`, ${n} horários`:", indisponível"}">${d}${n?`<span class="dots">${"<i></i>".repeat(Math.min(3,Math.ceil(n/4)))}</span>`:""}</button>`}
    root.innerHTML=`<div class="calh"><button class="nv" data-nav="-1" aria-label="Mês anterior">‹</button><h3 aria-live="polite">${cap(label)}</h3><button class="nv" data-nav="1" aria-label="Próximo mês">›</button></div>
    <div class="cal" role="grid">${["D","S","T","Q","Q","S","S"].map(x=>`<div class="h">${x}</div>`).join("")}${"<div></div>".repeat(off)}${cells}</div>
    <div class="legend"><span><i></i>Mais pontos = mais horários livres</span></div><div id="sl"></div>`;
    root.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{cur=new Date(y,m+ +b.dataset.nav,1);selDate=sel=null;onPick(null);draw()});
    root.querySelectorAll(".day.ok").forEach(b=>b.onclick=()=>{selDate=b.dataset.d;sel=null;onPick(null);draw()});
    if(selDate){const sl=slotsFor(selDate,min,exclude,now()),mor=sl.filter(s=>s.getHours()<12),tar=sl.filter(s=>s.getHours()>=12);let k=0;
      const grp=(l,ic2,a)=>a.length?`<div class="per">${ic(ic2,18)} ${l}</div><div class="slots">${a.map(s=>`<button class="slot" style="animation-delay:${k++*45}ms" aria-pressed="${sel&&+sel===+s}" data-t="${+s}">${hm(s)}</button>`).join("")}</div>`:"";
      $("#sl").innerHTML=`<h4 style="margin:22px 0 0;font-size:22px">${fdate(selDate+"T12:00")}</h4>${grp("Manhã","sun",mor)}${grp("Tarde","moon",tar)}${sl.length?"":'<p class="muted">Nenhum horário livre neste dia.</p>'}`;
      root.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{sel=new Date(+b.dataset.t);onPick(sel);root.querySelectorAll(".slot").forEach(x=>x.setAttribute("aria-pressed",x===b))})}}
  draw()}

   return `<div class="li" style="border-left-color:${colorOf(a.phone)};cursor:default"><div style="flex:1"><div class="t">${svcOf(a.sv).name}</div><div class="small muted" style="text-transform:capitalize">${fdate(a.start)} · ${hm(new Date(a.start))} · ${a.code}</div></div>${pill(a)}${can?`<button class="btn s line" data-r="${a.id}">Remarcar</button><button class="btn s danger" data-c="${a.id}">Cancelar</button>`:""}</div>`}).join("")+`</div>`;
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>reschedModal(S.appts.find(x=>x.id===b.dataset.r),"paciente"));

function reschedModal(a,who){
  const sv=svcOf(a.sv);if(who==="paciente"&&+new Date(a.start)-Date.now()<CFG.cancelH*36e5){toast(`O prazo de ${CFG.cancelH}h já passou. Fale com a profissional.`);return}

  if(AD.view==="semana"){const ws=startWeek(d),days=Array.from({length:7},(_,i)=>{const x=new Date(ws);x.setDate(x.getDate()+i);return x});
    ag.innerHTML=`<div style="overflow:auto"><div class="wk"><div><div class="wkh">&nbsp;</div><div style="position:relative;height:${(H1-H0+1)*PX}px">${Array.from({length:H1-H0+1},(_,k)=>`<div class="hr" style="top:${k*PX}px;border:0;font-size:12px;padding-left:6px">${pad(H0+k)}h</div>`).join("")}</div></div>
    ${days.map(x=>`<div class="wkc"><div class="wkh ${iso(x)===iso(new Date())?"today":""}">${x.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit"})}</div><div style="position:relative;height:${(H1-H0+1)*PX}px">${Array.from({length:H1-H0+1},(_,k)=>`<div class="hr" style="top:${k*PX}px;border-top:1px dashed #f0e6dd"></div>`).join("")}${offBands(x,0)}${dayAppts(x).map((a,i)=>ev(a,i,true)).join("")}</div></div>`).join("")}</div></div>`}
  if(AD.view==="mes"){const y=d.getFullYear(),m=d.getMonth(),dim=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay();
    ag.innerHTML=`<div class="mg">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(x=>`<div class="h">${x}</div>`).join("")}${"<div></div>".repeat(off)}${Array.from({length:dim},(_,i)=>{const x=new Date(y,m,i+1),L=dayAppts(x).filter(a=>a.status!=="cancelled"),bl=S.blocks.some(b=>iso(new Date(b.start))===iso(x));
      return `<button class="mc ${iso(x)===iso(new Date())?"today":""}" data-day="${iso(x)}" style="animation-delay:${i*15}ms"><span class="d">${i+1}</span>${bl?`<span class="ct">${ic("lock",12)} bloqueado</span>`:""}${L.length?`<span class="ct">${L.length} consulta${L.length>1?"s":""}</span>`:""}<span class="dts">${L.map(a=>`<i style="background:${colorOf(a.phone)}" title="${esc(a.name)}"></i>`).join("")}</span></button>`}).join("")}</div>`}
  bindA(ag);ag.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const[y,m,dd]=b.dataset.day.split("-").map(Number);AD.date=new Date(y,m-1,dd);AD.view="dia";renderAdmin()});
  ag.querySelectorAll("[data-free]").forEach(b=>b.onclick=()=>newModal(new Date(+b.dataset.free)))}

function apptModal(a){
  const open=["pending","confirmed"].includes(a.status),c=colorOf(a.phone),hs=S.hist.filter(h=>h.appt===a.id),js=S.jobs.filter(j=>j.appt.id===a.id);
  const HL={created:"Criado",rescheduled:"Remarcado",cancelled:"Cancelado",status:"Status alterado"},JL={confirmation:"Confirmação",reminder_24h:"Lembrete 24h",rescheduled:"Remarcação",cancelled:"Cancelamento",reminder_extra:"Lembrete extra"};
  openModal(`<div class="mh" style="background:linear-gradient(135deg,${c},#4a2418)"><div style="display:flex;gap:14px;align-items:center">${av(a.name,a.phone)}<div><div style="opacity:.85;font-size:14px">Código ${a.code} · ${a.source==="manual"?"manual":"online"}</div><h3 style="color:#fff;font-size:28px">${esc(a.name)}</h3></div></div><div style="margin-top:12px">${pill(a)}</div></div>
  <div class="mb"><p style="margin:0;font-size:18px;color:var(--ink)">${fdate(a.start)}</p><p style="font-family:Fraunces;font-size:44px;margin:0;color:var(--maroon);line-height:1.1">${hm(new Date(a.start))} – ${hm(new Date(a.end))}</p><p class="muted">${svcOf(a.sv).name} · ${esc(a.phone)}</p>
  ${open?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">${a.status==="pending"?'<button class="btn s" data-st="confirmed">Confirmar</button>':""}<button class="btn s line" data-st="completed">Concluída</button><button class="btn s line" data-st="no_show">Registrar falta</button><button class="btn s line" id="rs">Reagendar</button><button class="btn s danger" id="cx">Cancelar</button></div>`:""}
  <h4 style="margin:18px 0 10px;font-size:19px">Histórico de alterações</h4><ul class="hist">${hs.map(h=>`<li><b>${HL[h.action]||h.action}</b> · ${fshort(h.at)} ${hm(new Date(h.at))} · ${h.who}${h.from?`<br><span class="muted">${fshort(h.from)} ${hm(new Date(h.from))} → ${fshort(h.to)} ${hm(new Date(h.to))}</span>`:""}${h.note?`<br><span class="muted">Motivo: ${esc(h.note)}</span>`:""}${h.to_status?`<br><span class="muted">→ ${ST[h.to_status]}</span>`:""}</li>`).join("")}</ul>
  <h4 style="margin:12px 0 8px;font-size:19px">Notificações</h4><ul class="small" style="padding-left:18px;margin:0">${js.map(j=>`<li>${JL[j.type]} · ${fshort(j.at)} ${hm(new Date(j.at))} · <b>${j.status==="test_sent"?"modo teste":j.status==="pending"?"agendada":j.status}</b></li>`).join("")||"<li>Nenhuma.</li>"}</ul><div style="margin-top:18px"><button class="btn line" onclick="closeModal()">Fechar</button></div></div>`);
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{setStatus(a,b.dataset.st);save();closeModal();renderAdmin();toast("Status atualizado.")});
  if($("#rs"))$("#rs").onclick=()=>reschedModal(a,"profissional");
  if($("#cx"))$("#cx").onclick=()=>{const r=prompt("Motivo administrativo (opcional):","");if(r===null)return;cancelAppt(a,"profissional",r);save();closeModal();renderAdmin();toast("Consulta cancelada e horário liberado. Paciente notificado (na fila).")}}
function newModal(start){
  openModal(`<div class="mh" style="background:linear-gradient(135deg,#b87a59,#4a2418)"><h3 style="color:#fff;font-size:26px">Novo agendamento</h3><div style="opacity:.9">${fdate(start)} · ${hm(start)}</div></div><div class="mb"><div class="fld"><label class="l" for="ms">Serviço</label><select id="ms">${SERVICES.map(s=>`<option value="${s.id}">${s.name} (${s.min} min)</option>`).join("")}</select></div><div class="fld"><label class="l" for="mn">Nome</label><input id="mn"></div><div class="fld"><label class="l" for="mt">Telefone</label><input id="mt" inputmode="tel"></div><p class="err" id="me"></p><div class="row"><button class="btn line" onclick="closeModal()">Fechar</button><button class="btn" id="mk">Criar</button></div></div>`);
  $("#mk").onclick=()=>{const n=$("#mn").value.trim(),t=$("#mt").value.replace(/\D/g,"");if(n.length<2||t.length<10){$("#me").textContent="Informe nome e telefone válidos.";return}
    const sv=$("#ms").value;if(!slotsFor(iso(start),svcOf(sv).min,null,new Date(0)).some(s=>+s===+start)){$("#me").textContent="Este serviço não cabe neste horário (conflito).";return}
    mk(n,t,start,sv,"manual");save();closeModal();renderAdmin();toast("Agendamento criado.")}}

function pPacientes(el){
  const ps=[...new Map(S.appts.map(a=>[a.phone,a])).keys()].map(ph=>{const L=S.appts.filter(a=>a.phone===ph).sort((a,b)=>new Date(a.start)-new Date(b.start));return{ph,name:L[0].name,L,next:L.find(a=>["pending","confirmed"].includes(a.status)&&new Date(a.start)>new Date())}});
  el.innerHTML=`<div class="topbar"><h1>Pacientes</h1><input id="q" placeholder="Buscar por nome ou telefone" style="max-width:320px"></div><p class="muted small">Dados administrativos apenas — este sistema não é prontuário.</p><div class="cards" id="pl"></div>`;
  const draw=t=>{$("#pl").innerHTML=ps.filter(p=>(p.name+p.ph).toLowerCase().includes(t.toLowerCase())).map((p,i)=>`<button class="card hv" data-p="${p.ph}" style="text-align:left;padding:20px;animation:up .5s ${i*50}ms both"><div style="display:flex;gap:14px;align-items:center">${av(p.name,p.ph)}<div><b style="font-family:Fraunces;font-size:19px;color:var(--ink)">${esc(p.name)}</b><div class="small muted">${esc(p.ph)}</div></div></div><div class="small" style="margin-top:12px">${p.L.length} agendamento(s) · ${p.L.filter(a=>a.status==="no_show").length} falta(s)</div><div class="small muted">${p.next?"Próxima: "+fshort(p.next.start)+" "+hm(new Date(p.next.start)):"Sem consulta futura"}</div></button>`).join("");
    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=ps.find(x=>x.ph===b.dataset.p);openModal(`<div class="mh" style="background:linear-gradient(135deg,${colorOf(p.ph)},#4a2418)"><div style="display:flex;gap:14px;align-items:center">${av(p.name,p.ph)}<h3 style="color:#fff;font-size:28px">${esc(p.name)}</h3></div></div><div class="mb"><h4 style="margin-bottom:10px">Histórico administrativo</h4>${p.L.map(a=>liA(a,true)).join("")}<button class="btn line" style="margin-top:12px" onclick="closeModal()">Fechar</button></div>`);bindA($("#modal"))})};
  draw("");$("#q").oninput=e=>draw(e.target.value)}

function pFila(el){
  const L={confirmation:"Confirmação",reminder_24h:"Lembrete 24h",reminder_extra:"Lembrete extra",rescheduled:"Remarcação",cancelled:"Cancelamento"},SL={pending:["Pendente","st-pending"],test_sent:["Modo teste (não enviada)","st-completed"],cancelled:["Cancelada","st-cancelled"]};
  const jobs=[...S.jobs].sort((a,b)=>new Date(b.at)-new Date(a.at));
  el.innerHTML=`<div class="topbar"><h1>Central de notificações</h1><button class="btn" id="proc">▶ Processar fila (modo teste)</button></div><div class="g2"><div class="pnl" style="overflow:auto"><table><thead><tr><th>Tipo</th><th>Paciente</th><th>Programada</th><th>Status</th></tr></thead><tbody>${jobs.map(j=>`<tr class="rw" data-j="${j.id}"><td>${L[j.type]}</td><td>${esc(j.appt.name)}</td><td>${fshort(j.at)} ${hm(new Date(j.at))}</td><td><span class="pill-s ${SL[j.status][1]}"><i></i>${SL[j.status][0]}</span></td></tr>`).join("")||'<tr><td colspan="4" class="muted">Fila vazia.</td></tr>'}</tbody></table></div><div class="pnl"><h3>Pré-visualização</h3><div class="wa" id="prev"><p class="muted small">Clique em uma mensagem da fila para ver como o paciente a recebe.</p></div><p class="small muted">Remarcar ou cancelar descarta lembretes antigos; falha de envio nunca apaga o agendamento.</p></div></div>`;
  $("#proc").onclick=()=>{let n=0;S.jobs.forEach(j=>{if(j.status==="pending"&&new Date(j.at)<=new Date()){j.status="test_sent";n++}});save();toast(n?`${n} mensagem(ns) processada(s) em modo teste.`:"Nada vencido agora: lembretes ficam agendados.");renderAdmin()};
  el.querySelectorAll("[data-j]").forEach(r=>r.onclick=()=>{const j=S.jobs.find(x=>x.id===r.dataset.j);$("#prev").innerHTML=`<div class="bub">${esc(renderTpl(j))}</div><p class="small muted" style="margin-top:10px">Enviado como modelo aprovado da Meta (WhatsApp Business Platform).</p>`})}
function renderTpl(j){const t=S.tpl[j.type]||S.tpl.confirmation,sv=svcOf(j.appt.sv)||SERVICES[1];
  return t.replace(/\{\{(\w+)\}\}/g,(_,k)=>({nome:j.appt.name.split(" ")[0],psicologa:PRO.name,data:fdate(j.appt.start),horario:hm(new Date(j.appt.start)),modalidade:sv.mod==="online"?"Online":"Presencial",link:"agenda.exemplo.com.br/agendamento/•••••"})[k]??"")}

function pDisp(el){
  const D=["","Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
  el.innerHTML=`<div class="topbar"><h1>Disponibilidade</h1></div><div class="g2"><div class="pnl"><h3>Jornada semanal</h3>${[1,2,3,4,5,6,7].map(d=>{const r=CFG.rules[d]||[],on=r.length>0,m=r[0]||["09:00","12:00"],t=r[1]||["14:00","18:00"];return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:12px;align-items:center;min-width:130px"><button class="tgl" role="switch" aria-checked="${on}" data-tg="${d}" aria-label="${D[d]}"></button><b>${D[d]}</b></div>${on?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input type="time" value="${m[0]}" data-r="${d},0,0" style="width:112px"> – <input type="time" value="${m[1]}" data-r="${d},0,1" style="width:112px"> <span class="muted">almoço</span> <input type="time" value="${t[0]}" data-r="${d},1,0" style="width:112px"> – <input type="time" value="${t[1]}" data-r="${d},1,1" style="width:112px"></div>`:'<span class="muted small">Sem atendimento</span>'}</div>`}).join("")}</div>
  <div class="pnl"><h3>Regras de agendamento</h3>${[["step","Intervalo entre horários (min)",5],["buffer","Preparação entre sessões (min)",0],["minNoticeH","Antecedência mínima (horas)",0],["maxAdvanceD","Agendar até (dias à frente)",1],["cancelH","Prazo para cancelar/remarcar (horas)",0]].map(([k,l,mn])=>`<div class="fld"><label class="l">${l}</label><input type="number" min="${mn}" value="${CFG[k]}" data-c="${k}"></div>`).join("")}<div class="alert a-ok" id="pvw"></div><p class="small muted">Mudanças valem para novos agendamentos; consultas já marcadas são preservadas.</p></div></div>`;
  const pv=()=>{const n=slotsFor(iso(at(1,0)),50).length;$("#pvw").innerHTML=`Pré-visualização: <b>${n}</b> horários de 50 min no próximo dia útil.`};pv();
  el.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const d=+b.dataset.tg;if(CFG.rules[d]?.length)delete CFG.rules[d];else CFG.rules[d]=[["09:00","12:00"],["14:00","18:00"]];save();renderAdmin()});
  el.querySelectorAll("[data-r]").forEach(i=>i.onchange=()=>{const[d,w,p]=i.dataset.r.split(",").map(Number);CFG.rules[d][w][p]=i.value;if(CFG.rules[d].some(x=>x[1]<=x[0])){toast("O fim deve ser depois do início.");CFG.rules[d][w][p]=p?"18:00":"09:00"}save();renderAdmin()});
  el.querySelectorAll("[data-c]").forEach(i=>i.onchange=()=>{CFG[i.dataset.c]=Math.max(0,+i.value||0);save();pv()})}

function pBloq(el){
  el.innerHTML=`<div class="topbar"><h1>Bloqueios, férias e feriados</h1></div><div class="g2"><div class="pnl"><h3>Bloquear período</h3><div class="fld"><label class="l" for="bd">Data</label><input type="date" id="bd" value="${iso(new Date())}"></div><div class="fld"><label class="l" for="br">Motivo</label><input id="br" placeholder="Folga, feriado, férias…"></div><div class="row"><div class="fld" style="flex:1"><label class="l" for="bs">Início (opcional)</label><input type="time" id="bs"></div><div class="fld" style="flex:1"><label class="l" for="be">Fim (opcional)</label><input type="time" id="be"></div></div><button class="btn" id="addb">Bloquear</button><p class="small muted">Sem horas = dia inteiro. Consultas já marcadas são preservadas e você é avisada.</p></div>
  <div class="pnl"><h3>Períodos bloqueados</h3>${S.blocks.map(b=>`<div class="li" style="border-left-color:var(--bronze);cursor:default">${ic("lock",18)}<div style="flex:1"><div class="t">${esc(b.reason)}</div><div class="small muted">${fshort(b.start)} ${hm(new Date(b.start))} → ${hm(new Date(b.end))}</div></div><button class="btn s line" data-ub="${b.id}">Desbloquear</button></div>`).join("")||'<p class="muted">Nenhum.</p>'}</div></div>`;
  $("#addb").onclick=()=>{const d=$("#bd").value,bs=$("#bs").value,be=$("#be").value;if(!d)return;const[y,m,dd]=d.split("-").map(Number);
    const st=bs&&be?new Date(y,m-1,dd,...bs.split(":").map(Number)):new Date(y,m-1,dd,0,0),en=bs&&be?new Date(y,m-1,dd,...be.split(":").map(Number)):new Date(y,m-1,dd+1,0,0);if(en<=st){toast("O fim deve ser depois do início.");return}
    const conf=S.appts.filter(a=>["pending","confirmed"].includes(a.status)&&overlaps(+new Date(a.start),+new Date(a.end),+st,+en)).length;
    S.blocks.push({id:uid(),start:st.toISOString(),end:en.toISOString(),reason:$("#br").value||"Bloqueio"});save();toast(conf?`Bloqueado. Atenção: ${conf} consulta(s) já marcada(s) foram preservadas — remarque ou cancele.`:"Período bloqueado: esses horários somem para os pacientes.");renderAdmin()};
  el.querySelectorAll("[data-ub]").forEach(b=>b.onclick=()=>{S.blocks=S.blocks.filter(x=>x.id!==b.dataset.ub);save();renderAdmin()})}

function pPortfolio(el){
  el.innerHTML=`<div class="topbar"><h1>Portfólio público</h1><button class="btn" id="view">Ver no site →</button></div><div class="pnl"><p class="muted small">Edite aqui e veja o site mudar — sem programar. Respeite o Código de Ética e as normas do CFP sobre publicidade (sem promessas de resultado e sem depoimentos de pacientes).</p>
  ${[["name","Nome profissional","input"],["crp","CRP","input"],["headline","Título principal","textarea"],["sub","Texto de apoio","textarea"],["bio","Apresentação","textarea"],["approach","Abordagem terapêutica","textarea"],["city","Cidade (presencial)","input"]].map(([k,l,t])=>`<div class="fld"><label class="l">${l}</label>${t==="input"?`<input data-p="${k}" value="${esc(PRO[k])}">`:`<textarea rows="3" data-p="${k}">${esc(PRO[k])}</textarea>`}</div>`).join("")}
  <div class="fld"><label class="l">Áreas de atuação (separadas por vírgula)</label><input data-pl="spec" value="${esc(PRO.spec.join(", "))}"></div><div class="fld"><label class="l">Formação (uma por linha)</label><textarea rows="3" data-pl="edu">${esc(PRO.edu.join("\n"))}</textarea></div></div>`;
  el.querySelectorAll("[data-p]").forEach(i=>i.oninput=()=>{PRO[i.dataset.p]=i.value;save()});
  el.querySelectorAll("[data-pl]").forEach(i=>i.oninput=()=>{PRO[i.dataset.pl]=i.value.split(i.dataset.pl==="spec"?",":"\n").map(s=>s.trim()).filter(Boolean);save()});
  $("#view").onclick=()=>show("P")}
function pWhats(el){
  el.innerHTML=`<div class="topbar"><h1>WhatsApp</h1></div><div class="alert a-warn">🧪 Modo de teste ativo. Para envio real: variáveis do servidor + modelos aprovados na Meta (veja <code>docs/WHATSAPP.md</code>).</div><div class="g2"><div class="pnl"><h3>Modelos de mensagem</h3>${[["confirmation","Confirmação"],["reminder_24h","Lembrete 24h antes"]].map(([k,l])=>`<div class="fld"><label class="l">${l}</label><textarea rows="5" data-t="${k}">${esc(S.tpl[k])}</textarea></div>`).join("")}<p class="small muted">Variáveis: {{nome}} {{psicologa}} {{data}} {{horario}} {{modalidade}} {{link}}. Sem conteúdo clínico.</p></div>
  <div class="pnl"><h3>Pré-visualização</h3><div class="wa"><div class="bub" id="b1"></div><div style="height:12px"></div><div class="bub" id="b2"></div></div></div></div>`;
  const j={appt:{name:"Ana Paula Souza",start:at(1,10).toISOString(),sv:"s2"}},pv=()=>{$("#b1").textContent=renderTpl({...j,type:"confirmation"});$("#b2").textContent=renderTpl({...j,type:"reminder_24h"})};pv();
  el.querySelectorAll("[data-t]").forEach(t=>t.oninput=()=>{S.tpl[t.dataset.t]=t.value;save();pv()})}

/* ===================== navegação ===================== */
function show(v){const A=v==="A";$("#site").classList.toggle("hide",A);$("#admin").classList.toggle("hide",!A);document.body.classList.toggle("admin",A);window.scrollTo(0,0);A?renderAdmin():renderSite()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
load();show("P");
</script>
</body>
